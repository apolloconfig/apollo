#
# Local MySQL for Apollo development.
#
# The SQL files below are mounted into /docker-entrypoint-initdb.d and are only
# executed when the MySQL data directory is empty, i.e. on the first `up`.
# Later restarts reuse the data in the `apollo-mysql-data` volume.
# Use `docker compose -f docker-compose.local.yml down -v` to recreate it.
#
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: apollo
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - apollo-mysql-data:/var/lib/mysql
      - ./scripts/sql/profiles/mysql-default/apolloconfigdb.sql:/docker-entrypoint-initdb.d/01-apolloconfigdb.sql:ro
      - ./scripts/sql/profiles/mysql-default/apolloportaldb.sql:/docker-entrypoint-initdb.d/02-apolloportaldb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  apollo-mysql-data: