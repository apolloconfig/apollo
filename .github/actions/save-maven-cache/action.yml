name: Save CI Maven caches
description: Save downloaded Maven artifacts immediately after a successful build.
inputs:
  dependencies-key:
    description: Primary key from the setup-maven action.
    required: true
  dependencies-hit:
    description: Whether the exact dependency cache already exists.
    default: 'false'
  distribution-key:
    description: Primary distribution key, empty when the Wrapper is not used.
    default: ''
  distribution-hit:
    description: Whether the exact distribution cache already exists.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Save Maven dependencies
      if: inputs.dependencies-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository
        key: ${{ inputs.dependencies-key }}

    - name: Save Maven distribution
      if: inputs.distribution-key != '' && inputs.distribution-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/wrapper/dists
        key: ${{ inputs.distribution-key }}
