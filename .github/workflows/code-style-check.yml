# This workflow checks code style using Spotless

name: code style check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  code-style-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Set up CI Maven
      id: maven
      uses: ./.github/actions/setup-maven
    - name: Code Style Check
      run: mvn spotless:check
    - name: Save Maven caches
      uses: ./.github/actions/save-maven-cache
      with:
        dependencies-key: ${{ steps.maven.outputs.dependencies-key }}
        dependencies-hit: ${{ steps.maven.outputs.dependencies-hit }}
        distribution-key: ${{ steps.maven.outputs.distribution-key }}
        distribution-hit: ${{ steps.maven.outputs.distribution-hit }}
