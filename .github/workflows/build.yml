# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.jdk }}
    - name: Set up CI Maven
      id: maven
      uses: ./.github/actions/setup-maven
      with:
        cache-suffix: ${{ matrix.jdk }}
    - name: JDK 17
      if: matrix.jdk == '17'
      uses: nick-fields/retry@v3
      with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: mvn -B clean package jacoco:report -Dmaven.gitcommitid.skip=true
    - name: JDK 21
      if: matrix.jdk == '21'
      run: mvn -B clean compile -Dmaven.gitcommitid.skip=true
    - name: Save Maven caches
      uses: ./.github/actions/save-maven-cache
      with:
        dependencies-key: ${{ steps.maven.outputs.dependencies-key }}
        dependencies-hit: ${{ steps.maven.outputs.dependencies-hit }}
        distribution-key: ${{ steps.maven.outputs.distribution-key }}
        distribution-hit: ${{ steps.maven.outputs.distribution-hit }}
    - name: Upload coverage to Codecov
      if: matrix.jdk == '17'
      uses: codecov/codecov-action@v1
      with:
        file: ${{ github.workspace }}/apollo-*/target/site/jacoco/jacoco.xml
